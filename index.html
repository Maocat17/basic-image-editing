<!DOCTYPE html>
<html lang="zh-TW" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高畫質圖片編輯器</title>
    <!-- 引入 Tailwind CSS 及其設定 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
    <!-- 引入 Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        #text-input-container {
            display: none;
            position: absolute;
            z-index: 50;
        }

        #text-input {
            background: transparent;
            border: 1px dashed #3b82f6;
            outline: none;
            padding: 4px;
            margin: 0;
            min-width: 50px;
            min-height: 1em;
            white-space: pre-wrap;
            word-break: break-word;
            cursor: text;
        }

        #text-input:empty:before {
            content: attr(data-placeholder);
            color: #888;
            pointer-events: none;
            display: block;
        }

        .tool-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-btn.active {
            background-color: #3b82f6 !important;
            color: white !important;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            padding: 0;
            cursor: pointer;
            overflow: hidden;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 4px;
        }

        .props-group {
            display: none;
        }

        .props-group.active {
            display: flex;
        }
    </style>
</head>

<body class="flex flex-col h-screen select-none bg-gray-50 text-gray-800 dark:bg-[#1a1a1a] dark:text-[#e5e5e5] transition-colors duration-200">

    <!-- 頂部工具列 -->
    <div class="h-14 bg-white dark:bg-zinc-900 border-b border-gray-300 dark:border-zinc-800 flex items-center px-4 shrink-0 shadow-sm relative z-10 transition-colors">
        <!-- 檔案與還原操作 -->
        <div class="flex items-center gap-2 flex-nowrap shrink-0">
            <label class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded cursor-pointer text-sm font-medium transition whitespace-nowrap">
                <i class="ph ph-upload-simple text-lg"></i> 上傳圖片
                <input type="file" id="upload-img" accept="image/*" class="hidden">
            </label>
            <button id="btn-export" class="flex items-center gap-2 bg-gray-200 dark:bg-zinc-800 hover:bg-gray-300 dark:hover:bg-zinc-700 px-3 py-1.5 rounded text-sm font-medium transition disabled:opacity-50 whitespace-nowrap" disabled>
                <i class="ph ph-download-simple text-lg"></i> 匯出高畫質
            </button>
            <div class="w-px h-6 bg-gray-300 dark:bg-zinc-700 mx-2"></div>
            <button id="btn-undo" class="tool-btn hover:bg-gray-200 dark:hover:bg-zinc-700" title="往回一步 (Ctrl+Z)" disabled><i class="ph ph-arrow-u-up-left text-xl"></i></button>
            <button id="btn-redo" class="tool-btn hover:bg-gray-200 dark:hover:bg-zinc-700" title="往前一步 (Ctrl+Y)" disabled><i class="ph ph-arrow-u-up-right text-xl"></i></button>
        </div>

        <!-- 動態工具屬性面板 -->
        <div class="flex-1 flex items-center overflow-x-auto ml-4 pl-4 border-l border-gray-300 dark:border-zinc-700 gap-4 flex-nowrap">

            <!-- 選取模式：刪除按鈕 -->
            <button id="btn-delete" class="hidden items-center gap-1 bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded text-sm font-medium transition whitespace-nowrap" title="刪除選取物件 (Delete)">
                <i class="ph ph-trash text-lg"></i> 刪除
            </button>
            <div id="select-divider" class="hidden w-px h-6 bg-gray-300 dark:bg-zinc-700 mx-1"></div>

            <!-- 圖形與橡皮擦屬性 -->
            <div id="props-draw" class="props-group items-center gap-3 whitespace-nowrap flex-nowrap">
                <div id="color-picker-container" class="flex items-center gap-1" title="顏色">
                    <input type="color" id="color-picker">
                    <button id="btn-eyedropper" class="tool-btn w-8 h-8 hover:bg-gray-200 dark:hover:bg-zinc-700" title="滴管 (吸取顏色)"><i class="ph ph-eyedropper text-lg"></i></button>
                </div>
                <!-- 粗細與微調按鈕 -->
                <div class="flex items-center gap-2" title="粗細">
                    <i class="ph ph-line-segments text-gray-500 dark:text-zinc-400"></i>
                    <button id="btn-line-width-dec" class="w-6 h-6 rounded bg-gray-200 dark:bg-zinc-800 hover:bg-gray-300 dark:hover:bg-zinc-700 flex items-center justify-center text-xs font-bold transition select-none">-</button>
                    <input type="range" id="line-width" min="1" max="100" value="5" class="w-20 cursor-pointer">
                    <button id="btn-line-width-inc" class="w-6 h-6 rounded bg-gray-200 dark:bg-zinc-800 hover:bg-gray-300 dark:hover:bg-zinc-700 flex items-center justify-center text-xs font-bold transition select-none">+</button>
                    <span id="line-width-val" class="text-xs w-6 text-center font-mono">5</span>
                </div>
                <!-- 矩形圓角拉桿 -->
                <div id="radius-container" class="flex items-center gap-2 hidden whitespace-nowrap flex-nowrap" title="圓角程度">
                    <i class="ph ph-corners-down text-gray-500 dark:text-zinc-400"></i>
                    <span class="text-xs font-medium mr-1">圓角</span>
                    <button id="btn-border-radius-dec" class="w-6 h-6 rounded bg-gray-200 dark:bg-zinc-800 hover:bg-gray-300 dark:hover:bg-zinc-700 flex items-center justify-center text-xs font-bold transition select-none">-</button>
                    <input type="range" id="border-radius" min="0" max="100" value="0" class="w-20 cursor-pointer">
                    <button id="btn-border-radius-inc" class="w-6 h-6 rounded bg-gray-200 dark:bg-zinc-800 hover:bg-gray-300 dark:hover:bg-zinc-700 flex items-center justify-center text-xs font-bold transition select-none">+</button>
                    <span id="border-radius-val" class="text-xs w-6 text-center font-mono">0</span>
                </div>
                <div id="shape-style-toggle" class="flex bg-gray-200 dark:bg-zinc-800 rounded p-1">
                    <button class="px-2 py-1 rounded text-sm font-medium transition-colors whitespace-nowrap" data-style="stroke" title="空心">空心</button>
                    <button class="px-2 py-1 rounded text-sm font-medium transition-colors whitespace-nowrap" data-style="fill" title="實心">實心</button>
                </div>
            </div>

            <!-- 富文本文字屬性 -->
            <div id="props-text" class="props-group items-center gap-3 whitespace-nowrap flex-nowrap">
                <div class="flex items-center gap-1" title="文字顏色">
                    <input type="color" id="text-color-picker">
                </div>
                <select id="font-family" class="bg-gray-100 dark:bg-zinc-800 border border-gray-300 dark:border-zinc-700 rounded px-2 py-1 text-sm outline-none whitespace-nowrap">
                    <option value="sans-serif">預設無襯線體</option>
                    <option value="serif">預設襯線體</option>
                    <option value="monospace">等寬字體</option>
                </select>
                <label class="flex items-center gap-1 bg-gray-200 dark:bg-zinc-800 hover:bg-gray-300 dark:hover:bg-zinc-700 px-2 py-1 rounded cursor-pointer text-sm transition whitespace-nowrap" title="匯入自訂字型 (.ttf, .otf)">
                    <i class="ph ph-file-plus"></i> 匯入
                    <input type="file" id="upload-font" accept=".ttf,.otf,.woff,.woff2" class="hidden">
                </label>
                <!-- 字體大小與微調按鈕 -->
                <div class="flex items-center gap-2 ml-1" title="選取文字修改大小">
                    <i class="ph ph-text-t text-gray-500 dark:text-zinc-400"></i>
                    <button id="btn-font-size-dec" class="w-6 h-6 rounded bg-gray-200 dark:bg-zinc-800 hover:bg-gray-300 dark:hover:bg-zinc-700 flex items-center justify-center text-xs font-bold transition select-none">-</button>
                    <input type="range" id="font-size" min="10" max="120" value="48" class="w-20 cursor-pointer">
                    <button id="btn-font-size-inc" class="w-6 h-6 rounded bg-gray-200 dark:bg-zinc-800 hover:bg-gray-300 dark:hover:bg-zinc-700 flex items-center justify-center text-xs font-bold transition select-none">+</button>
                    <span id="font-size-val" class="text-xs w-6 text-center font-mono">48</span>
                </div>
                <div class="flex bg-gray-200 dark:bg-zinc-800 rounded p-1 ml-1 gap-1">
                    <button id="btn-bold" class="format-btn w-8 h-8 rounded flex items-center justify-center hover:bg-gray-300 dark:hover:bg-zinc-700"><i class="ph ph-text-b text-lg"></i></button>
                    <button id="btn-italic" class="format-btn w-8 h-8 rounded flex items-center justify-center hover:bg-gray-300 dark:hover:bg-zinc-700"><i class="ph ph-text-italic text-lg"></i></button>
                    <button id="btn-underline" class="format-btn w-8 h-8 rounded flex items-center justify-center hover:bg-gray-300 dark:hover:bg-zinc-700"><i class="ph ph-text-underline text-lg"></i></button>
                </div>
            </div>

            <!-- 視角與主題控制 -->
            <div class="ml-auto flex items-center gap-1 border-l border-gray-300 dark:border-zinc-700 pl-4 shrink-0 flex-nowrap whitespace-nowrap">
                <button id="btn-zoom-out" class="tool-btn w-8 h-8 hover:bg-gray-200 dark:hover:bg-zinc-700" title="縮小"><i class="ph ph-magnifying-glass-minus text-lg"></i></button>
                <span id="zoom-val" class="text-xs w-12 text-center font-mono">100%</span>
                <button id="btn-zoom-in" class="tool-btn w-8 h-8 hover:bg-gray-200 dark:hover:bg-zinc-700" title="放大"><i class="ph ph-magnifying-glass-plus text-lg"></i></button>
                <button id="btn-fit" class="tool-btn w-8 h-8 hover:bg-gray-200 dark:hover:bg-zinc-700" title="適應畫面"><i class="ph ph-corners-out text-lg"></i></button>
                <div class="w-px h-6 bg-gray-300 dark:bg-zinc-700 mx-2"></div>
                <button id="btn-theme" class="tool-btn w-8 h-8 hover:bg-gray-200 dark:hover:bg-zinc-700" title="切換亮/暗主題">
                    <i class="ph ph-moon text-lg dark:hidden block"></i>
                    <i class="ph ph-sun text-lg hidden dark:block"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 主要編輯區 -->
    <div class="flex-1 flex overflow-hidden">
        <!-- 左側工具列 -->
        <div class="w-16 bg-white dark:bg-zinc-900 border-r border-gray-300 dark:border-zinc-800 flex flex-col items-center py-4 gap-3 shrink-0 z-10 shadow-sm transition-colors">
            <button class="tool-btn tool-select active hover:bg-gray-200 dark:hover:bg-zinc-700 text-blue-500" data-tool="select" title="選取物件 (雙擊文字可編輯)"><i class="ph ph-cursor text-2xl"></i></button>
            <div class="w-10 h-px bg-gray-300 dark:bg-zinc-700 my-1"></div>
            <button class="tool-btn tool-select hover:bg-gray-200 dark:hover:bg-zinc-700" data-tool="pan" title="拖曳視角 (或按住右鍵拖曳)"><i class="ph ph-hand text-2xl"></i></button>
            <button class="tool-btn tool-select hover:bg-gray-200 dark:hover:bg-zinc-700" data-tool="crop" title="裁切圖片"><i class="ph ph-crop text-2xl"></i></button>
            <div class="w-10 h-px bg-gray-300 dark:bg-zinc-700 my-1"></div>
            <button class="tool-btn tool-select hover:bg-gray-200 dark:hover:bg-zinc-700" data-tool="rect" title="畫矩形"><i class="ph ph-rectangle text-2xl"></i></button>
            <button class="tool-btn tool-select hover:bg-gray-200 dark:hover:bg-zinc-700" data-tool="circle" title="畫圓形"><i class="ph ph-circle text-2xl"></i></button>
            <button class="tool-btn tool-select hover:bg-gray-200 dark:hover:bg-zinc-700" data-tool="text" title="輸入文字"><i class="ph ph-text-t text-2xl"></i></button>
            <div class="w-10 h-px bg-gray-300 dark:bg-zinc-700 my-1"></div>
            <button class="tool-btn tool-select hover:bg-gray-200 dark:hover:bg-zinc-700" data-tool="erase" title="橡皮擦 (可擦除圖形與文字)"><i class="ph ph-eraser text-2xl"></i></button>
            <div class="w-10 h-px bg-gray-300 dark:bg-zinc-700 my-1"></div>
            <!-- 清空畫布 -->
            <button id="btn-clear-all" class="tool-btn hover:bg-red-100 dark:hover:bg-red-950/30 text-red-500" title="清空所有繪圖與文字"><i class="ph ph-trash-simple text-2xl"></i></button>
        </div>

        <!-- 畫布容器 -->
        <div id="canvas-container" class="flex-1 relative bg-gray-200 dark:bg-neutral-950 overflow-hidden cursor-default transition-colors">
            <div id="welcome-msg" class="absolute inset-0 flex items-center justify-center text-gray-400 dark:text-zinc-500 pointer-events-none">
                <div class="text-center">
                    <i class="ph ph-image text-6xl mb-4"></i>
                    <p>請先上傳圖片以開始編輯</p>
                </div>
            </div>

            <canvas id="main-canvas" class="absolute top-0 left-0"></canvas>

            <!-- 富文本輸入框 (懸浮) -->
            <div id="text-input-container">
                <div id="text-input" contenteditable="true" spellcheck="false" data-placeholder="輸入文字..."></div>
            </div>
        </div>
    </div>

    <!-- 自訂確認視窗 -->
    <div id="confirm-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="bg-white dark:bg-zinc-900 rounded-lg shadow-xl p-6 max-w-sm w-full mx-4 border border-gray-200 dark:border-zinc-800 transition-all scale-100">
            <div class="flex items-center gap-3 mb-3 text-red-500">
                <i class="ph ph-warning-circle text-3xl"></i>
                <h3 class="text-lg font-bold text-gray-900 dark:text-white" id="confirm-title">確認操作</h3>
            </div>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-6 leading-relaxed" id="confirm-message">是否確定清空畫布上所有的繪圖與文字？此操作無法還原。</p>
            <div class="flex justify-end gap-3 flex-nowrap">
                <button id="confirm-cancel" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-gray-700 dark:text-gray-300 rounded text-sm font-medium transition whitespace-nowrap">取消</button>
                <button id="confirm-ok" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded text-sm font-medium transition whitespace-nowrap">確定清空</button>
            </div>
        </div>
    </div>

    <script>
        // --- DOM 元素與狀態 ---
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const textInputContainer = document.getElementById('text-input-container');
        const textInput = document.getElementById('text-input');
        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d');

        // 核心狀態
        let img = null;
        let originalImgWidth = 0;
        let originalImgHeight = 0;
        let crop = {
            x: 0,
            y: 0,
            w: 0,
            h: 0
        };
        let view = {
            scale: 1,
            panX: 0,
            panY: 0
        };

        let history = []; // 儲存所有物件指令
        let historyStep = -1;

        let currentTool = 'select';
        let isDrawing = false;
        let isPanning = false;
        let isCropping = false;
        let cropHandle = null;
        let startPt = {
            x: 0,
            y: 0
        };
        let lastPt = {
            x: 0,
            y: 0
        };
        let currentCmd = null;

        // 選取模式狀態
        let selectedObj = null;
        let isDraggingObj = false;
        let isResizingObj = false;
        let resizeHandleObj = null;
        let originalObjState = null;

        // 富文本狀態
        let textStartPt = {
            x: 0,
            y: 0
        };
        let editingTextObj = null; // 正在編輯的現有文字物件
        let base64Fonts = {}; // 儲存自訂字型 base64 以供 SVG 渲染

        // 工具獨立設定
        let settings = {
            rect: {
                color: '#ff0000',
                lineWidth: 5,
                shapeStyle: 'stroke',
                borderRadius: 0
            },
            circle: {
                color: '#3b82f6',
                lineWidth: 5,
                shapeStyle: 'stroke'
            },
            erase: {
                lineWidth: 30
            },
            text: {
                color: '#eab308',
                fontFamily: 'sans-serif',
                fontSize: 48,
                isBold: false,
                isItalic: false,
                isUnderline: false
            }
        };

        // --- 初始化 ---
        function init() {
            resizeCanvas();
            window.addEventListener('resize', () => {
                resizeCanvas();
                requestRender();
            });

            // 啟用舊版 execCommand 的 CSS 模式，確保產生 inline style
            document.execCommand('styleWithCSS', false, true);

            document.querySelectorAll('.tool-select').forEach(btn => {
                btn.addEventListener('click', (e) => setTool(e.currentTarget.dataset.tool));
            });

            // 綁定 Slider 和 "+/-" 按鈕
            setupSliderWithButtons('line-width', 'btn-line-width-dec', 'btn-line-width-inc', 'line-width-val', (val) => {
                if (selectedObj && ['rect', 'circle'].includes(selectedObj.type)) {
                    selectedObj.lineWidth = val;
                    requestRender();
                } else if (['rect', 'circle', 'erase'].includes(currentTool)) {
                    settings[currentTool].lineWidth = val;
                }
            });

            setupSliderWithButtons('border-radius', 'btn-border-radius-dec', 'btn-border-radius-inc', 'border-radius-val', (val) => {
                if (selectedObj && selectedObj.type === 'rect') {
                    selectedObj.borderRadius = val;
                    requestRender();
                } else if (currentTool === 'rect') {
                    settings.rect.borderRadius = val;
                }
            });

            setupSliderWithButtons('font-size', 'btn-font-size-dec', 'btn-font-size-inc', 'font-size-val', (val) => {
                if (textInputContainer.style.display === 'block') {
                    applyHtmlFontSize(val);
                } else {
                    settings.text.fontSize = parseInt(val); // ← 確保更新 settings
                }
            });

            // --- 屬性面板事件 ---
            document.getElementById('color-picker').addEventListener('input', (e) => {
                const val = e.target.value;
                if (selectedObj && ['rect', 'circle'].includes(selectedObj.type)) {
                    selectedObj.color = val;
                    requestRender();
                } else if (['rect', 'circle'].includes(currentTool)) {
                    settings[currentTool].color = val;
                }
            });

            document.querySelectorAll('#shape-style-toggle button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const style = e.target.dataset.style;
                    if (selectedObj && ['rect', 'circle'].includes(selectedObj.type)) {
                        selectedObj.style = style;
                        requestRender();
                    } else if (['rect', 'circle'].includes(currentTool)) {
                        settings[currentTool].shapeStyle = style;
                    }
                    syncFormatButtonsUI();
                });
            });

            // 富文本 UI 事件
            document.getElementById('text-color-picker').addEventListener('input', (e) => {
                if (textInputContainer.style.display === 'block') document.execCommand('foreColor', false, e.target.value);
                else settings.text.color = e.target.value;
            });
            document.getElementById('font-family').addEventListener('change', (e) => {
                if (textInputContainer.style.display === 'block') document.execCommand('fontName', false, e.target.value);
                else settings.text.fontFamily = e.target.value;
            });

            // 粗斜底按鈕
            ['bold', 'italic', 'underline'].forEach(style => {
                document.getElementById(`btn-${style}`).addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    document.execCommand(style, false, null);
                });
            });

            // 系統功能按鈕
            document.getElementById('upload-img').addEventListener('change', handleImageUpload);
            document.getElementById('upload-font').addEventListener('change', handleFontUpload);
            document.getElementById('btn-export').addEventListener('click', exportImage);
            document.getElementById('btn-undo').addEventListener('click', undo);
            document.getElementById('btn-redo').addEventListener('click', redo);
            document.getElementById('btn-eyedropper').addEventListener('click', () => setTool('eyedropper'));
            document.getElementById('btn-theme').addEventListener('click', () => document.documentElement.classList.toggle('dark'));

            document.getElementById('btn-zoom-in').addEventListener('click', () => zoom(1.2));
            document.getElementById('btn-zoom-out').addEventListener('click', () => zoom(1 / 1.2));
            document.getElementById('btn-fit').addEventListener('click', fitToScreen);

            // 刪除與清空按鈕
            document.getElementById('btn-delete').addEventListener('click', deleteSelectedObject);
            document.getElementById('btn-clear-all').addEventListener('click', () => {
                if (!img) return;
                showConfirmModal(
                    '確認清空畫布',
                    '是否確定清空畫布上所有的繪圖、圓圈、方形與文字？此操作也會重設歷史紀錄，且無法復原。',
                    () => {
                        history = [];
                        historyStep = -1;
                        selectedObj = null;
                        editingTextObj = null;
                        updateSysUI();
                        updateToolbarForCurrentContext();
                        requestRender();
                    }
                );
            });

            window.addEventListener('keydown', (e) => {
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    if (selectedObj && textInputContainer.style.display === 'none') deleteSelectedObject();
                }
            });

            // 畫布滑鼠事件
            container.addEventListener('mousedown', onMouseDown);
            container.addEventListener('dblclick', onDoubleClick);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            container.addEventListener('wheel', onWheel, {
                passive: false
            });
            container.addEventListener('contextmenu', e => e.preventDefault());

            textInputContainer.addEventListener('mousedown', e => e.stopPropagation());
            document.getElementById('props-text').addEventListener('mousedown', e => e.stopPropagation());

            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && textInputContainer.style.display === 'none') {
                    if (e.key === 'z' || e.key === 'Z') {
                        e.preventDefault();
                        undo();
                    }
                    if (e.key === 'y' || e.key === 'Y') {
                        e.preventDefault();
                        redo();
                    }
                }
            });

            setTool('select');
        }

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        // --- 整合 +/- 按鈕之 Slider 輔助函式 ---
        function setupSliderWithButtons(sliderId, decBtnId, incBtnId, displayId, updateCallback) {
            const slider = document.getElementById(sliderId);
            const decBtn = document.getElementById(decBtnId);
            const incBtn = document.getElementById(incBtnId);
            const display = document.getElementById(displayId);

            const update = (newVal) => {
                newVal = Math.max(parseInt(slider.min), Math.min(parseInt(slider.max), newVal));
                slider.value = newVal;
                if (display) display.textContent = newVal;
                updateCallback(newVal);
            };

            // 防止點擊 +/- 按鈕搶走 contenteditable 的 Focus
            const preventFocusStealing = (e) => e.preventDefault();
            decBtn.addEventListener('mousedown', preventFocusStealing);
            incBtn.addEventListener('mousedown', preventFocusStealing);

            decBtn.addEventListener('click', () => update(parseInt(slider.value) - 1));
            incBtn.addEventListener('click', () => update(parseInt(slider.value) + 1));
            slider.addEventListener('input', (e) => update(parseInt(e.target.value)));
        }

        // --- 自訂 Confirm Modal 彈窗機制 ---
        function showConfirmModal(title, message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            modal.classList.remove('hidden');

            const btnOk = document.getElementById('confirm-ok');
            const btnCancel = document.getElementById('confirm-cancel');

            // 複製並重新繫結以防止重複觸發
            const newOk = btnOk.cloneNode(true);
            const newCancel = btnCancel.cloneNode(true);
            btnOk.parentNode.replaceChild(newOk, btnOk);
            btnCancel.parentNode.replaceChild(newCancel, btnCancel);

            newOk.addEventListener('click', () => {
                modal.classList.add('hidden');
                onConfirm();
            });
            newCancel.addEventListener('click', () => {
                modal.classList.add('hidden');
            });
        }

        // --- 工具切換與 UI 同步 ---
        function setTool(tool) {
            if (tool !== 'text') commitText();
            if (tool !== 'select' && tool !== 'eyedropper') selectedObj = null;

            currentTool = tool;

            document.querySelectorAll('.tool-select').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tool === tool);
            });

            container.className = 'flex-1 relative bg-gray-200 dark:bg-neutral-950 overflow-hidden transition-colors ';
            if (tool === 'pan') container.classList.add('cursor-grab');
            else if (tool === 'text') container.classList.add('cursor-text');
            else if (tool === 'select') container.classList.add('cursor-default');
            else if (tool === 'crop') container.classList.add('cursor-default');
            else container.classList.add('cursor-crosshair');

            updateToolbarForCurrentContext();
            requestRender();
        }

        function updateToolbarForCurrentContext() {
            document.querySelectorAll('.props-group').forEach(p => p.classList.remove('active'));
            document.getElementById('btn-delete').classList.add('hidden');
            document.getElementById('select-divider').classList.add('hidden');

            let contextObj = null;
            let contextTool = currentTool;

            if (selectedObj && currentTool === 'select') {
                contextObj = selectedObj;
                contextTool = selectedObj.type;
                document.getElementById('btn-delete').classList.remove('hidden');
                document.getElementById('select-divider').classList.remove('hidden');
            }

            if (['rect', 'circle'].includes(contextTool)) {
                document.getElementById('props-draw').classList.add('active');
                document.getElementById('color-picker-container').style.display = 'flex';
                document.getElementById('shape-style-toggle').style.display = 'flex';

                const rContainer = document.getElementById('radius-container');
                if (contextTool === 'rect') rContainer.classList.remove('hidden');
                else rContainer.classList.add('hidden');

                const source = contextObj || settings[contextTool];
                document.getElementById('color-picker').value = source.color;
                document.getElementById('line-width').value = source.lineWidth;
                document.getElementById('line-width-val').textContent = source.lineWidth;
                if (contextTool === 'rect') {
                    document.getElementById('border-radius').value = source.borderRadius || 0;
                    document.getElementById('border-radius-val').textContent = source.borderRadius || 0;
                }
            } else if (contextTool === 'erase') {
                document.getElementById('props-draw').classList.add('active');
                document.getElementById('color-picker-container').style.display = 'none';
                document.getElementById('shape-style-toggle').style.display = 'none';
                document.getElementById('radius-container').classList.add('hidden');

                const source = contextObj || settings.erase;
                document.getElementById('line-width').value = source.lineWidth;
                document.getElementById('line-width-val').textContent = source.lineWidth;
            } else if (contextTool === 'text') {
                document.getElementById('props-text').classList.add('active');

                // 新增：同步設定到工具列
                document.getElementById('text-color-picker').value = settings.text.color;
                document.getElementById('font-family').value = settings.text.fontFamily;
                document.getElementById('font-size').value = settings.text.fontSize;
                document.getElementById('font-size-val').textContent = settings.text.fontSize;
            }
            syncFormatButtonsUI(contextObj);
        }

        function syncFormatButtonsUI(contextObj = null) {
            const toolType = contextObj ? contextObj.type : currentTool;
            if (['rect', 'circle'].includes(toolType)) {
                const currentStyle = contextObj ? contextObj.style : settings[toolType].shapeStyle;
                document.querySelectorAll('#shape-style-toggle button').forEach(btn => {
                    if (btn.dataset.style === currentStyle) {
                        btn.className = 'px-2 py-1 rounded text-sm font-medium transition-colors bg-white shadow-sm dark:bg-zinc-600 dark:shadow-none text-blue-600 dark:text-white';
                    } else {
                        btn.className = 'px-2 py-1 rounded text-sm font-medium transition-colors text-gray-600 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-zinc-700';
                    }
                });
            }
        }

        function updateSysUI() {
            document.getElementById('btn-undo').disabled = historyStep < 0;
            document.getElementById('btn-redo').disabled = historyStep >= history.length - 1;
            const hasImg = !!img;
            document.getElementById('btn-export').disabled = !hasImg;
            document.getElementById('welcome-msg').style.display = hasImg ? 'none' : 'flex';
            document.getElementById('zoom-val').textContent = Math.round(view.scale * 100) + '%';
        }

        // --- 檔案與字型上傳 ---
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const newImg = new Image();
                newImg.onload = () => {
                    img = newImg;
                    originalImgWidth = img.width;
                    originalImgHeight = img.height;
                    crop = {
                        x: 0,
                        y: 0,
                        w: img.width,
                        h: img.height
                    };
                    history = [];
                    historyStep = -1;
                    selectedObj = null;
                    fitToScreen();
                    updateSysUI();
                };
                newImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        function handleFontUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const b64 = event.target.result;
                const fontName = `CustomFont_${Date.now()}`;
                base64Fonts[fontName] = b64;

                const fontFace = new FontFace(fontName, `url(${b64})`);
                fontFace.load().then(loadedFace => {
                    document.fonts.add(loadedFace);
                    const select = document.getElementById('font-family');
                    const option = document.createElement('option');
                    option.value = fontName;
                    option.textContent = file.name.split('.')[0];
                    select.appendChild(option);
                    select.value = fontName;

                    if (textInputContainer.style.display === 'block') document.execCommand('fontName', false, fontName);
                    else settings.text.fontFamily = fontName;
                });
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        // --- 座標轉換 (優化防飄移) ---
        function screenToImage(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left - view.panX) / view.scale,
                y: (clientY - rect.top - view.panY) / view.scale
            };
        }

        function imageToCanvas(imgX, imgY) {
            return {
                x: imgX * view.scale + view.panX,
                y: imgY * view.scale + view.panY
            };
        }

        // --- 視角與滑鼠互動 ---
        function fitToScreen() {
            if (!img) return;
            const pad = 40;
            view.scale = Math.min((canvas.width - pad * 2) / crop.w, (canvas.height - pad * 2) / crop.h);
            view.panX = canvas.width / 2 - (crop.x + crop.w / 2) * view.scale;
            view.panY = canvas.height / 2 - (crop.y + crop.h / 2) * view.scale;
            requestRender();
        }

        function zoom(factor, cx = canvas.width / 2, cy = canvas.height / 2) {
            if (!img) return;
            const oldScale = view.scale;
            view.scale = Math.max(0.01, Math.min(view.scale * factor, 50));
            view.panX = cx - (cx - view.panX) * (view.scale / oldScale);
            view.panY = cy - (cy - view.panY) * (view.scale / oldScale);

            if (textInputContainer.style.display === 'block' && editingTextObj) {
                textInput.style.transform = `scale(${view.scale * editingTextObj.scale})`;
                const sc = imageToCanvas(editingTextObj.x, editingTextObj.y);
                textInputContainer.style.left = sc.x + 'px';
                textInputContainer.style.top = sc.y + 'px';
            }
            requestRender();
        }

        function onWheel(e) {
            if (!img) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            zoom(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - rect.left, e.clientY - rect.top);
        }

        function onMouseDown(e) {
            if (!img) return;
            const pt = screenToImage(e.clientX, e.clientY);

            // === 改進版：只有點擊「畫布區域」且不是文字框本身時才 commit ===
            if (textInputContainer.style.display === 'block') {
                const isClickingTextBox = e.target.closest('#text-input-container') ||
                    e.target.id === 'text-input';

                if (!isClickingTextBox) {
                    commitText();

                    // 如果是文字工具，點擊外部後不要立刻開新輸入框
                    if (currentTool === 'text') {
                        return;
                    }
                } else {
                    // 點擊文字框內部 → 什麼都不做，讓 contenteditable 正常運作
                    return;
                }
            }

            // 右鍵或平移
            if (e.button === 2 || e.button === 1 || currentTool === 'pan') {
                isPanning = true;
                lastPt = {
                    x: e.clientX,
                    y: e.clientY
                };
                if (currentTool === 'pan') container.classList.replace('cursor-grab', 'cursor-grabbing');
                return;
            }
            if (e.button !== 0) return;

            if (currentTool === 'eyedropper') {
                pickColor(e.clientX, e.clientY);
                setTool('rect');
                return;
            }

            if (currentTool === 'crop') {
                cropHandle = getHitCropHandle(pt.x, pt.y);
                if (cropHandle) isCropping = true;
                return;
            }

            if (currentTool === 'select') {
                const handle = getHitSelectionHandle(pt.x, pt.y);
                if (handle) {
                    isResizingObj = true;
                    resizeHandleObj = handle;
                    startPt = {
                        x: pt.x,
                        y: pt.y
                    };
                    originalObjState = JSON.parse(JSON.stringify(selectedObj));
                    return;
                }
                const hitObj = getHitObject(pt.x, pt.y);
                selectedObj = hitObj;
                updateToolbarForCurrentContext();
                if (hitObj) {
                    isDraggingObj = true;
                    startPt = {
                        x: pt.x,
                        y: pt.y
                    };
                    originalObjState = JSON.parse(JSON.stringify(hitObj));
                }
                requestRender();
                return;
            }

            if (currentTool === 'text') {
                showTextInput(e.clientX, e.clientY, pt);
                return;
            }

            // 開始繪圖
            isDrawing = true;
            startPt = pt;
            const newId = Date.now().toString();
            if (currentTool === 'erase') {
                currentCmd = {
                    id: newId,
                    type: 'erase',
                    lineWidth: settings.erase.lineWidth,
                    points: [pt]
                };
            } else if (['rect', 'circle'].includes(currentTool)) {
                currentCmd = {
                    id: newId,
                    type: currentTool,
                    style: settings[currentTool].shapeStyle,
                    color: settings[currentTool].color,
                    lineWidth: settings[currentTool].lineWidth,
                    borderRadius: currentTool === 'rect' ? settings.rect.borderRadius : 0,
                    x: pt.x,
                    y: pt.y,
                    w: 0,
                    h: 0
                };
            }
        }

        function onMouseMove(e) {
            if (!img) return;
            if (isPanning) {
                view.panX += e.clientX - lastPt.x;
                view.panY += e.clientY - lastPt.y;
                lastPt = {
                    x: e.clientX,
                    y: e.clientY
                };
                requestRender();
                return;
            }

            const pt = screenToImage(e.clientX, e.clientY);

            if (isCropping && cropHandle) {
                let newX = crop.x,
                    newY = crop.y,
                    newW = crop.w,
                    newH = crop.h;
                if (cropHandle.includes('w')) {
                    newW += (crop.x - pt.x);
                    newX = pt.x;
                }
                if (cropHandle.includes('e')) {
                    newW = pt.x - crop.x;
                }
                if (cropHandle.includes('n')) {
                    newH += (crop.y - pt.y);
                    newY = pt.y;
                }
                if (cropHandle.includes('s')) {
                    newH = pt.y - crop.y;
                }
                if (newW > 10 && newH > 10) {
                    crop.x = Math.max(0, Math.min(newX, originalImgWidth - 10));
                    crop.y = Math.max(0, Math.min(newY, originalImgHeight - 10));
                    crop.w = Math.min(newW, originalImgWidth - crop.x);
                    crop.h = Math.min(newH, originalImgHeight - crop.y);
                }
                requestRender();
                return;
            }

            if (isDraggingObj && selectedObj) {
                selectedObj.x = originalObjState.x + (pt.x - startPt.x);
                selectedObj.y = originalObjState.y + (pt.y - startPt.y);
                requestRender();
                return;
            }

            if (isResizingObj && selectedObj && originalObjState) {
                const dx = pt.x - startPt.x;
                const dy = pt.y - startPt.y;

                if (selectedObj.type === 'text') {
                    if (resizeHandleObj === 'se') {
                        const originalW = originalObjState.w * originalObjState.scale;
                        const newW = Math.max(20, originalW + dx);
                        selectedObj.scale = newW / originalObjState.w;
                    }
                } else {
                    let newX = originalObjState.x,
                        newY = originalObjState.y;
                    let newW = originalObjState.w,
                        newH = originalObjState.h;
                    if (newW < 0) {
                        newX += newW;
                        newW = Math.abs(newW);
                    }
                    if (newH < 0) {
                        newY += newH;
                        newH = Math.abs(newH);
                    }

                    if (resizeHandleObj.includes('w')) {
                        newW -= dx;
                        newX += dx;
                    }
                    if (resizeHandleObj.includes('e')) {
                        newW += dx;
                    }
                    if (resizeHandleObj.includes('n')) {
                        newH -= dy;
                        newY += dy;
                    }
                    if (resizeHandleObj.includes('s')) {
                        newH += dy;
                    }

                    selectedObj.x = newX;
                    selectedObj.y = newY;
                    selectedObj.w = newW;
                    selectedObj.h = newH;
                }
                requestRender();
                return;
            }

            // 選取模式游標
            if (currentTool === 'select') {
                const handle = getHitSelectionHandle(pt.x, pt.y);
                if (handle) {
                    if (handle === 'nw' || handle === 'se') canvas.style.cursor = 'nwse-resize';
                    else if (handle === 'ne' || handle === 'sw') canvas.style.cursor = 'nesw-resize';
                } else if (getHitObject(pt.x, pt.y)) {
                    canvas.style.cursor = 'move';
                } else {
                    canvas.style.cursor = 'default';
                }
            } else if (currentTool === 'crop' && !isCropping) {
                const handle = getHitCropHandle(pt.x, pt.y);
                if (handle) {
                    if (handle === 'nw' || handle === 'se') canvas.style.cursor = 'nwse-resize';
                    else if (handle === 'ne' || handle === 'sw') canvas.style.cursor = 'nesw-resize';
                    else if (handle === 'n' || handle === 's') canvas.style.cursor = 'ns-resize';
                    else if (handle === 'e' || handle === 'w') canvas.style.cursor = 'ew-resize';
                } else canvas.style.cursor = 'default';
            }

            if (isDrawing && currentCmd) {
                if (currentTool === 'erase') {
                    currentCmd.points.push(pt);
                } else {
                    currentCmd.w = pt.x - startPt.x;
                    currentCmd.h = pt.y - startPt.y;
                }
                requestRender();
            }
        }

        function onMouseUp(e) {
            if (isPanning) {
                isPanning = false;
                if (currentTool === 'pan') container.classList.replace('cursor-grabbing', 'cursor-grab');
            }
            if (isCropping) {
                isCropping = false;
                cropHandle = null;
            }

            if (isDraggingObj || isResizingObj) {
                isDraggingObj = false;
                isResizingObj = false;
                resizeHandleObj = null;
                originalObjState = null;
                addCommand(null, true);
            }

            if (isDrawing && currentCmd) {
                isDrawing = false;
                let isValid = false;
                if (currentCmd.type === 'erase' && currentCmd.points.length > 1) isValid = true;
                if (['rect', 'circle'].includes(currentCmd.type) && (Math.abs(currentCmd.w) > 2 || Math.abs(currentCmd.h) > 2)) isValid = true;
                if (isValid) addCommand(currentCmd);
                currentCmd = null;
                requestRender();
            }
        }

        function onDoubleClick(e) {
            if (currentTool === 'select' && selectedObj && selectedObj.type === 'text') {
                editingTextObj = selectedObj;
                const sc = imageToCanvas(selectedObj.x, selectedObj.y);
                textInputContainer.style.display = 'block';
                textInputContainer.style.left = sc.x + 'px';
                textInputContainer.style.top = sc.y + 'px';

                textInput.innerHTML = selectedObj.html;
                textInput.style.transform = `scale(${view.scale * selectedObj.scale})`;
                textInput.style.transformOrigin = 'top left';
                textInput.focus();
                requestRender();
            }
        }

        // --- 核心與富文本系統 ---
        function addCommand(cmd, isUpdate = false) {
            if (historyStep < history.length - 1) history = history.slice(0, historyStep + 1);
            if (cmd) history.push(cmd);
            historyStep++;
            updateSysUI();
        }

        function undo() {
            if (historyStep >= 0) {
                historyStep--;
                selectedObj = null;
                updateToolbarForCurrentContext();
                requestRender();
            }
        }

        function redo() {
            if (historyStep < history.length - 1) {
                historyStep++;
                selectedObj = null;
                updateToolbarForCurrentContext();
                requestRender();
            }
        }

        function deleteSelectedObject() {
            if (selectedObj) {
                history = history.filter(cmd => cmd.id !== selectedObj.id);
                selectedObj = null;
                addCommand(null, true);
                updateToolbarForCurrentContext();
                requestRender();
            }
        }

        function showTextInput(screenX, screenY, imgPt) {
            textStartPt = imgPt;
            editingTextObj = null;

            const rect = canvas.getBoundingClientRect();
            textInputContainer.style.display = 'block';
            textInputContainer.style.left = (screenX - rect.left) + 'px';
            textInputContainer.style.top = (screenY - rect.top) + 'px';
            textInput.innerHTML = '';

            // === 完整套用目前設定 ===
            textInput.style.color = settings.text.color;
            textInput.style.fontFamily = settings.text.fontFamily;
            textInput.style.fontSize = settings.text.fontSize + 'px';
            textInput.style.fontWeight = settings.text.isBold ? 'bold' : 'normal';
            textInput.style.fontStyle = settings.text.isItalic ? 'italic' : 'normal';
            textInput.style.textDecoration = settings.text.isUnderline ? 'underline' : 'none';

            textInput.style.transform = `scale(${view.scale})`;
            textInput.style.transformOrigin = 'top left';
            textInput.style.lineHeight = '1.2'; // 新增：避免行高問題

            setTimeout(() => {
                textInput.focus();
                // 清除 execCommand 預設干擾
                document.execCommand('fontSize', false, '7');
                applyHtmlFontSize(settings.text.fontSize);
            }, 30);
        }

        function applyHtmlFontSize(size) {
            document.execCommand('fontSize', false, '7');
            const fonts = textInput.querySelectorAll('font[size="7"], span[style*="font-size: xxx-large"]');
            fonts.forEach(el => {
                el.removeAttribute('size');
                el.style.fontSize = size + 'px';
            });
        }

        async function commitText() {
            if (textInputContainer.style.display === 'none') return;

            const html = textInput.innerHTML.trim();
            const textContent = textInput.textContent.trim();

            textInputContainer.style.display = 'none';

            if (textContent !== '') {
                const rect = textInput.getBoundingClientRect();
                const currentScale = view.scale * (editingTextObj ? editingTextObj.scale : 1);
                const w = Math.max(20, rect.width / currentScale);
                const h = Math.max(20, rect.height / currentScale);

                const color = editingTextObj ? (editingTextObj.color || settings.text.color) : settings.text.color;
                const fontSize = editingTextObj ? (editingTextObj.fontSize || settings.text.fontSize) : settings.text.fontSize;
                const fontFamily = editingTextObj ? (editingTextObj.fontFamily || settings.text.fontFamily) : settings.text.fontFamily;

                // 產生 SVG 圖片
                const textImg = await generateTextSvg(html, w, h, color, fontSize, fontFamily);

                if (editingTextObj) {
                    editingTextObj.html = html;
                    editingTextObj.w = w;
                    editingTextObj.h = h;
                    editingTextObj.img = textImg;
                    addCommand(null, true);
                } else {
                    const newCmd = {
                        id: Date.now().toString(),
                        type: 'text',
                        html: html,
                        x: textStartPt.x,
                        y: textStartPt.y,
                        w: w,
                        h: h,
                        scale: 1,
                        img: textImg,
                        color: color,
                        fontSize: fontSize,
                        fontFamily: fontFamily
                    };
                    addCommand(newCmd);
                }
            } else if (editingTextObj) {
                // 空白 → 刪除
                history = history.filter(cmd => cmd.id !== editingTextObj.id);
                addCommand(null, true);
            }

            editingTextObj = null;
            requestRender();
            updateToolbarForCurrentContext();
        }
        async function generateTextSvg(html, width, height, color, fontSize, fontFamily) {
            let fontStyles = '';
            for (const [fontName, b64] of Object.entries(base64Fonts)) {
                fontStyles += `@font-face { font-family: '${fontName}'; src: url('${b64}'); }\n`;
            }

            const cleanHtml = html.replace(/<br>/g, '<br/>');

            const svgString = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
            <foreignObject width="100%" height="100%">
                <div xmlns="http://www.w3.org/1999/xhtml" 
                     style="margin:0; padding:8px; box-sizing:border-box; 
                            font-family:'${fontFamily}',sans-serif; 
                            font-size:${fontSize}px; 
                            color:${color}; 
                            white-space:pre-wrap; 
                            word-break:break-word; 
                            width:${width}px; 
                            height:${height}px;
                            line-height:1.2;">
                    <style>${fontStyles}</style>
                    ${cleanHtml}
                </div>
            </foreignObject>
        </svg>`;

            const blob = new Blob([svgString], {
                type: 'image/svg+xml;charset=utf-8'
            });
            const url = URL.createObjectURL(blob);

            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    resolve(img);
                };
                img.onerror = (e) => {
                    console.error("SVG 轉圖片失敗", e);
                    URL.revokeObjectURL(url);
                    resolve(null);
                };
                img.src = url;
            });
        }
        // --- 選取與碰撞偵測 ---
        function getHitObject(x, y) {
            const activeHistory = historyStep >= 0 ? history.slice(0, historyStep + 1) : [];
            for (let i = activeHistory.length - 1; i >= 0; i--) {
                const cmd = activeHistory[i];
                if (cmd.type === 'erase') continue;

                if (cmd.type === 'text') {
                    const scaledW = cmd.w * cmd.scale;
                    const scaledH = cmd.h * cmd.scale;
                    if (x >= cmd.x && x <= cmd.x + scaledW && y >= cmd.y && y <= cmd.y + scaledH) return cmd;
                } else if (cmd.type === 'rect') {
                    const rx = cmd.w < 0 ? cmd.x + cmd.w : cmd.x;
                    const ry = cmd.h < 0 ? cmd.y + cmd.h : cmd.y;
                    const rw = Math.abs(cmd.w);
                    const rh = Math.abs(cmd.h);
                    const pad = cmd.lineWidth / 2 + 5;
                    if (x >= rx - pad && x <= rx + rw + pad && y >= ry - pad && y <= ry + rh + pad) return cmd;
                } else if (cmd.type === 'circle') {
                    const cx = cmd.x + cmd.w / 2;
                    const cy = cmd.y + cmd.h / 2;
                    const rx = Math.abs(cmd.w / 2);
                    const ry = Math.abs(cmd.h / 2);
                    if (rx > 0 && ry > 0) {
                        const dx = x - cx;
                        const dy = y - cy;
                        if ((dx * dx) / ((rx + 10) * (rx + 10)) + (dy * dy) / ((ry + 10) * (ry + 10)) <= 1) return cmd;
                    }
                }
            }
            return null;
        }

        function getHitSelectionHandle(x, y) {
            if (!selectedObj) return null;
            const tolerance = 10 / view.scale;
            let sx, sy, sw, sh;
            if (selectedObj.type === 'text') {
                sx = selectedObj.x;
                sy = selectedObj.y;
                sw = selectedObj.w * selectedObj.scale;
                sh = selectedObj.h * selectedObj.scale;
            } else if (selectedObj.type === 'rect' || selectedObj.type === 'circle') {
                sx = selectedObj.w < 0 ? selectedObj.x + selectedObj.w : selectedObj.x;
                sy = selectedObj.h < 0 ? selectedObj.y + selectedObj.h : selectedObj.y;
                sw = Math.abs(selectedObj.w);
                sh = Math.abs(selectedObj.h);
            }

            const handles = {
                nw: {
                    x: sx,
                    y: sy
                },
                ne: {
                    x: sx + sw,
                    y: sy
                },
                sw: {
                    x: sx,
                    y: sy + sh
                },
                se: {
                    x: sx + sw,
                    y: sy + sh
                }
            };
            if (selectedObj.type === 'text') {
                if (Math.abs(x - handles.se.x) < tolerance && Math.abs(y - handles.se.y) < tolerance) return 'se';
                return null;
            }

            for (const pos in handles) {
                if (Math.abs(x - handles[pos].x) < tolerance && Math.abs(y - handles[pos].y) < tolerance) return pos;
            }
            return null;
        }

        function getHitCropHandle(x, y) {
            const tolerance = 15 / view.scale;
            const handles = {
                nw: {
                    x: crop.x,
                    y: crop.y
                },
                n: {
                    x: crop.x + crop.w / 2,
                    y: crop.y
                },
                ne: {
                    x: crop.x + crop.w,
                    y: crop.y
                },
                e: {
                    x: crop.x + crop.w,
                    y: crop.y + crop.h / 2
                },
                se: {
                    x: crop.x + crop.w,
                    y: crop.y + crop.h
                },
                s: {
                    x: crop.x + crop.w / 2,
                    y: crop.y + crop.h
                },
                sw: {
                    x: crop.x,
                    y: crop.y + crop.h
                },
                w: {
                    x: crop.x,
                    y: crop.y + crop.h / 2
                }
            };
            for (const pos in handles) {
                if (Math.abs(x - handles[pos].x) < tolerance && Math.abs(y - handles[pos].y) < tolerance) return pos;
            }
            return null;
        }

        function pickColor(screenX, screenY) {
            const rect = canvas.getBoundingClientRect();
            const pixel = ctx.getImageData(screenX - rect.left, screenY - rect.top, 1, 1).data;
            const hex = "#" + ("000000" + ((pixel[0] << 16) | (pixel[1] << 8) | pixel[2]).toString(16)).slice(-6);
            if (selectedObj && ['rect', 'circle'].includes(selectedObj.type)) {
                selectedObj.color = hex;
                updateToolbarForCurrentContext();
                requestRender();
            } else {
                settings.rect.color = hex;
                settings.circle.color = hex;
                settings.text.color = hex;
            }
        }

        // --- 渲染引擎 ---
        let renderRequested = false;

        function requestRender() {
            if (!renderRequested) {
                renderRequested = true;
                requestAnimationFrame(() => {
                    render();
                    renderRequested = false;
                });
            }
        }

        function drawCommands(targetCtx, activeHistory, currentPendingCmd) {
            targetCtx.lineCap = 'round';
            targetCtx.lineJoin = 'round';
            const cmdsToDraw = [...activeHistory];
            if (currentPendingCmd) cmdsToDraw.push(currentPendingCmd);

            for (const cmd of cmdsToDraw) {
                if (editingTextObj && cmd.id === editingTextObj.id) continue;

                targetCtx.globalCompositeOperation = cmd.type === 'erase' ? 'destination-out' : 'source-over';

                if (cmd.type === 'text') {
                    if (cmd.img) targetCtx.drawImage(cmd.img, cmd.x, cmd.y, cmd.w * cmd.scale, cmd.h * cmd.scale);
                    continue;
                }

                targetCtx.strokeStyle = cmd.color;
                targetCtx.fillStyle = cmd.color;
                targetCtx.lineWidth = cmd.lineWidth;

                if (cmd.type === 'rect') {
                    const x = cmd.w < 0 ? cmd.x + cmd.w : cmd.x;
                    const y = cmd.h < 0 ? cmd.y + cmd.h : cmd.y;
                    const w = Math.abs(cmd.w),
                        h = Math.abs(cmd.h);
                    targetCtx.beginPath();
                    if (cmd.borderRadius > 0 && targetCtx.roundRect) {
                        targetCtx.roundRect(x, y, w, h, cmd.borderRadius);
                    } else {
                        targetCtx.rect(x, y, w, h);
                    }
                    if (cmd.style === 'fill') targetCtx.fill();
                    else targetCtx.stroke();
                } else if (cmd.type === 'circle') {
                    targetCtx.beginPath();
                    targetCtx.ellipse(cmd.x + cmd.w / 2, cmd.y + cmd.h / 2, Math.abs(cmd.w / 2), Math.abs(cmd.h / 2), 0, 0, Math.PI * 2);
                    if (cmd.style === 'fill') targetCtx.fill();
                    else targetCtx.stroke();
                } else if (cmd.type === 'erase' && cmd.points.length > 1) {
                    targetCtx.beginPath();
                    targetCtx.moveTo(cmd.points[0].x, cmd.points[0].y);
                    for (let i = 1; i < cmd.points.length; i++) targetCtx.lineTo(cmd.points[i].x, cmd.points[i].y);
                    targetCtx.stroke();
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!img) return;

            // 1. 繪製裁切後的原圖
            ctx.save();
            ctx.translate(view.panX, view.panY);
            ctx.scale(view.scale, view.scale);
            ctx.beginPath();
            ctx.rect(crop.x, crop.y, crop.w, crop.h);
            ctx.clip();
            ctx.drawImage(img, 0, 0);
            ctx.restore();

            // 2. 準備離線畫布(依歷史紀錄依序繪製)
            if (offCanvas.width !== canvas.width || offCanvas.height !== canvas.height) {
                offCanvas.width = canvas.width;
                offCanvas.height = canvas.height;
            }
            offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
            offCtx.save();
            offCtx.translate(view.panX, view.panY);
            offCtx.scale(view.scale, view.scale);
            const activeHistory = historyStep >= 0 ? history.slice(0, historyStep + 1) : [];
            drawCommands(offCtx, activeHistory, currentCmd);
            offCtx.restore();

            // 3. 套用裁切遮罩並合成到主畫布上
            ctx.save();
            ctx.beginPath();
            const scX = crop.x * view.scale + view.panX;
            const scY = crop.y * view.scale + view.panY;
            ctx.rect(scX, scY, crop.w * view.scale, crop.h * view.scale);
            ctx.clip();
            ctx.drawImage(offCanvas, 0, 0);
            ctx.restore();

            // 4. UI: 裁切與選取框
            if (currentTool === 'crop') drawCropUI();
            if (currentTool === 'select') drawSelectionUI();
        }

        function drawSelectionUI() {
            if (!selectedObj || (editingTextObj && selectedObj.id === editingTextObj.id)) return;
            ctx.save();
            ctx.translate(view.panX, view.panY);
            ctx.scale(view.scale, view.scale);

            let x, y, w, h;
            if (selectedObj.type === 'text') {
                x = selectedObj.x;
                y = selectedObj.y;
                w = selectedObj.w * selectedObj.scale;
                h = selectedObj.h * selectedObj.scale;
            } else {
                x = selectedObj.w < 0 ? selectedObj.x + selectedObj.w : selectedObj.x;
                y = selectedObj.h < 0 ? selectedObj.y + selectedObj.h : selectedObj.y;
                w = Math.abs(selectedObj.w);
                h = Math.abs(selectedObj.h);
            }

            // 外框
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 2 / view.scale;
            ctx.setLineDash([5 / view.scale, 5 / view.scale]);
            ctx.strokeRect(x, y, w, h);

            // 控制點 (文字僅顯示右下角)
            ctx.setLineDash([]);
            ctx.fillStyle = '#fff';
            const handleSize = 10 / view.scale;
            const handles = selectedObj.type === 'text' ? [{
                hx: x + w,
                hy: y + h
            }] : [{
                hx: x,
                hy: y
            }, {
                hx: x + w,
                hy: y
            }, {
                hx: x,
                hy: y + h
            }, {
                hx: x + w,
                hy: y + h
            }];

            for (let {
                    hx,
                    hy
                }
                of handles) {
                ctx.beginPath();
                ctx.arc(hx, hy, handleSize / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawCropUI() {
            ctx.save();
            const sc = imageToCanvas(crop.x, crop.y);
            const sw = crop.w * view.scale;
            const sh = crop.h * view.scale;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(0, 0, canvas.width, sc.y);
            ctx.fillRect(0, sc.y + sh, canvas.width, canvas.height - (sc.y + sh));
            ctx.fillRect(0, sc.y, sc.x, sh);
            ctx.fillRect(sc.x + sw, sc.y, canvas.width - (sc.x + sw), sh);
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 2;
            ctx.strokeRect(sc.x, sc.y, sw, sh);

            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(sc.x + sw / 3, sc.y);
            ctx.lineTo(sc.x + sw / 3, sc.y + sh);
            ctx.moveTo(sc.x + sw * 2 / 3, sc.y);
            ctx.lineTo(sc.x + sw * 2 / 3, sc.y + sh);
            ctx.moveTo(sc.x, sc.y + sh / 3);
            ctx.lineTo(sc.x + sw, sc.y + sh / 3);
            ctx.moveTo(sc.x, sc.y + sh * 2 / 3);
            ctx.lineTo(sc.x + sw, sc.y + sh * 2 / 3);
            ctx.stroke();

            const handles = [{
                    x: sc.x,
                    y: sc.y
                }, {
                    x: sc.x + sw / 2,
                    y: sc.y
                }, {
                    x: sc.x + sw,
                    y: sc.y
                },
                {
                    x: sc.x,
                    y: sc.y + sh / 2
                }, {
                    x: sc.x + sw,
                    y: sc.y + sh / 2
                },
                {
                    x: sc.x,
                    y: sc.y + sh
                }, {
                    x: sc.x + sw / 2,
                    y: sc.y + sh
                }, {
                    x: sc.x + sw,
                    y: sc.y + sh
                }
            ];
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 2;
            handles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });
            ctx.restore();
        }

        function exportImage() {
            if (!img) return;
            const expCanvas = document.createElement('canvas');
            expCanvas.width = crop.w;
            expCanvas.height = crop.h;
            const expCtx = expCanvas.getContext('2d');

            expCtx.drawImage(img, crop.x, crop.y, crop.w, crop.h, 0, 0, crop.w, crop.h);

            const offExpCanvas = document.createElement('canvas');
            offExpCanvas.width = crop.w;
            offExpCanvas.height = crop.h;
            const offExpCtx = offExpCanvas.getContext('2d');

            offExpCtx.save();
            offExpCtx.translate(-crop.x, -crop.y);
            const activeHistory = historyStep >= 0 ? history.slice(0, historyStep + 1) : [];
            drawCommands(offExpCtx, activeHistory, null);
            offExpCtx.restore();

            expCtx.drawImage(offExpCanvas, 0, 0);

            const link = document.createElement('a');
            link.download = `edited_${Date.now()}.png`;
            link.href = expCanvas.toDataURL('image/png', 1.0);
            link.click();
        }

        init();
    </script>
</body>

</html>
